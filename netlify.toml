# Configuración para Netlify deployment
[build]
  base = "datalens_frontend/"
  publish = "datalens_frontend/build"
  command = "npm run build"

# Redirects para React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"