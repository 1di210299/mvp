# render.yaml - Configuración para Render
services:
  - type: web
    name: datalens-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn datalens_backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: datalens-db
          property: connectionString
    
  - type: redis
    name: datalens-redis
    
databases:
  - name: datalens-db
    databaseName: datalens
    user: datalens