version: '3.8'

services:
  # Aplicación principal
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    image: whatsapp-sales-bot:latest
    container_name: whatsapp-sales-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whatsapp_sales
      - REDIS_URL=redis://redis:6379/0
      - UVICORN_WORKERS=4
      - TZ=America/Lima
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - whatsapp-network

  # Panel de administración
  admin:
    build: 
      context: .
      dockerfile: Dockerfile
    image: whatsapp-sales-bot:latest
    container_name: whatsapp-sales-admin
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - APP_ROLE=admin
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whatsapp_sales
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Lima
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - whatsapp-network

  # Worker para procesos en segundo plano
  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    image: whatsapp-sales-bot:latest
    container_name: whatsapp-sales-worker
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_ROLE=worker
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whatsapp_sales
      - REDIS_URL=redis://redis:6379/0
      - TZ=America/Lima
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - db
      - redis
    networks:
      - whatsapp-network

  # Base de datos PostgreSQL
  db:
    image: postgres:14-alpine
    container_name: whatsapp-sales-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whatsapp_sales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - whatsapp-network

  # Redis para caché y colas
  redis:
    image: redis:7-alpine
    container_name: whatsapp-sales-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - whatsapp-network

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: whatsapp-sales-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - whatsapp-network

  # Grafana para visualización de métricas
  grafana:
    image: grafana/grafana:latest
    container_name: whatsapp-sales-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - whatsapp-network

  # Nginx como proxy inverso (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: whatsapp-sales-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/www:/var/www/html
    depends_on:
      - app
      - admin
      - grafana
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: