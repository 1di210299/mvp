global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'whatsapp-sales-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['app:8000']
        labels:
          instance: 'app'
          service: 'whatsapp-sales'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']